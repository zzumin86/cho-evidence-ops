name: W5 evidence ops (수동 승인 전용)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [env-guard, reachability, permission-gates, publish, publish-manifest, issuer-probe-db, issuer-dry-run, issuer-issue]
      expected_code_sha:
        description: 이 공개 ops 저장소 main의 승인된 40자 SHA
        required: true
        type: string
      manifest_reference:
        description: 비공개 evidence Storage의 manifest reference (원문 입력 금지)
        type: string
      expected_manifest_hash:
        description: 해당 manifest의 SHA256
        type: string
      expected_runtime_code_sha:
        description: manifest에 봉인된 runtime commit SHA (backend 도구 SHA와 구분)
        type: string
      confirm_manifest_hash:
        description: issuer-issue만 동일 SHA256을 다시 입력
        type: string
      evidence_kind:
        type: choice
        default: BOOTSTRAP_INVENTORY
        options: [BOOTSTRAP_INVENTORY, NORMAL_STOP]

permissions:
  contents: read

concurrency:
  group: w5-evidence-ops
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_sha: ${{ steps.pin.outputs.backend_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
      - id: pin
        env:
          EXPECTED_SHA: ${{ inputs.expected_code_sha }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          modes = {'env-guard', 'reachability', 'permission-gates', 'publish', 'publish-manifest', 'issuer-probe-db', 'issuer-dry-run', 'issuer-issue'}
          ok = (os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and
                os.environ['GITHUB_REF'] == 'refs/heads/main' and
                re.fullmatch('[a-f0-9]{40}', os.environ['EXPECTED_SHA']) and
                os.environ['EXPECTED_SHA'] == os.environ['GITHUB_SHA'] and os.environ['MODE'] in modes)
          if not ok:
              print('{"status":"REFUSED"}')
              raise SystemExit(2)
          raw = Path('approved/backend_sha').read_text()
          if not re.fullmatch('[a-f0-9]{40}\n', raw):
              print('{"status":"REFUSED"}')
              raise SystemExit(2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('backend_sha=' + raw)
          print('{"status":"PASS"}')
          PY
  publisher:
    needs: validate
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["env-guard","reachability","permission-gates","publish","publish-manifest"]'), inputs.mode)
    environment: w5-evidence-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: inputs.mode == 'env-guard'
        run: echo '{"status":"PASS","checks":[{"id":"ENV_GUARD","status":"PASS"}]}'
      - if: inputs.mode != 'env-guard'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false
          show-progress: false
      - if: inputs.mode != 'env-guard'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zzumin86/cho-trading-backend
          ref: ${{ needs.validate.outputs.backend_sha }}
          token: ${{ secrets.CHO_BACKEND_READ_TOKEN }}
          path: backend
          persist-credentials: false
          show-progress: false
      - if: inputs.mode != 'env-guard'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - if: inputs.mode != 'env-guard'
        working-directory: backend
        run: |
          if ! python -m pip install --quiet --disable-pip-version-check -r requirements.txt -r requirements-dev.txt > /dev/null 2>&1; then
            echo '{"status":"REFUSED"}'
            exit 2
          fi
      - if: inputs.mode != 'env-guard'
        working-directory: backend
        env:
          MODE: ${{ inputs.mode }}
          OPS_SHA: ${{ inputs.expected_code_sha }}
          RUNTIME_SHA: ${{ inputs.expected_runtime_code_sha }}
          MANIFEST_REF: ${{ inputs.manifest_reference }}
          MANIFEST_HASH: ${{ inputs.expected_manifest_hash }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          CHO_APPROVED_BACKEND_SHA_FILE: ../ops/approved/backend_sha
          CHO_CHECKED_BACKEND_SHA: ${{ needs.validate.outputs.backend_sha }}
          CHO_RAW_PROJECT: ${{ vars.CHO_RAW_PROJECT }}
          CHO_RESEARCH_EVIDENCE_PROJECT: ${{ vars.CHO_RESEARCH_EVIDENCE_PROJECT }}
          CHO_RESEARCH_TRUSTED_EVIDENCE_BUCKET: ${{ vars.CHO_RESEARCH_TRUSTED_EVIDENCE_BUCKET }}
          W5_RESEARCH_STORAGE_BUCKET: ${{ vars.W5_RESEARCH_STORAGE_BUCKET }}
          CHO_SESSION_POOLER_HOST: ${{ vars.CHO_SESSION_POOLER_HOST }}
          CHO_EVIDENCE_OTHER_BUCKET_REFERENCE: ${{ vars.CHO_EVIDENCE_OTHER_BUCKET_REFERENCE }}
          CHO_EVIDENCE_SOURCE_DSN: ${{ secrets.CHO_EVIDENCE_SOURCE_DSN }}
          CHO_EVIDENCE_POLICY_DSN: ${{ secrets.CHO_EVIDENCE_POLICY_DSN }}
          CHO_EVIDENCE_PUBLISHER_KEY: ${{ secrets.CHO_EVIDENCE_PUBLISHER_KEY }}
          CHO_RESEARCH_EVIDENCE_READ_KEY: ${{ secrets.CHO_RESEARCH_EVIDENCE_READ_KEY }}
          CHO_RESEARCH_ISSUER_STORAGE_READ_KEY: ${{ secrets.CHO_RESEARCH_ISSUER_STORAGE_READ_KEY }}
        run: |
          python - <<'PY'
          import os
          from tools.w5_evidence_publisher import main
          args = ['--mode', os.environ['MODE'], '--actions-sha', os.environ['OPS_SHA'],
                  '--manifest-reference', os.environ['MANIFEST_REF'], '--expected-manifest-hash', os.environ['MANIFEST_HASH'],
                  '--expected-code-sha', os.environ['RUNTIME_SHA'], '--kind', os.environ['EVIDENCE_KIND']]
          if os.environ['MODE'] in ('publish', 'publish-manifest'):
              args.append('--publish')
          raise SystemExit(main(args))
          PY
  issuer:
    needs: validate
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["env-guard","issuer-probe-db","issuer-dry-run","issuer-issue"]'), inputs.mode)
    environment: w5-issuer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: inputs.mode == 'env-guard'
        run: echo '{"status":"PASS","checks":[{"id":"ENV_GUARD","status":"PASS"}]}'
      - if: inputs.mode != 'env-guard'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false
          show-progress: false
      - if: inputs.mode != 'env-guard'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zzumin86/cho-trading-backend
          ref: ${{ needs.validate.outputs.backend_sha }}
          token: ${{ secrets.CHO_BACKEND_READ_TOKEN }}
          path: backend
          persist-credentials: false
          show-progress: false
      - if: inputs.mode != 'env-guard'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - if: inputs.mode != 'env-guard'
        working-directory: backend
        run: |
          if ! python -m pip install --quiet --disable-pip-version-check -r requirements.txt -r requirements-dev.txt > /dev/null 2>&1; then
            echo '{"status":"REFUSED"}'
            exit 2
          fi
      - if: inputs.mode != 'env-guard'
        working-directory: backend
        env:
          MODE: ${{ inputs.mode }}
          OPS_SHA: ${{ inputs.expected_code_sha }}
          RUNTIME_SHA: ${{ inputs.expected_runtime_code_sha }}
          MANIFEST_REF: ${{ inputs.manifest_reference }}
          MANIFEST_HASH: ${{ inputs.expected_manifest_hash }}
          CONFIRM_HASH: ${{ inputs.confirm_manifest_hash }}
          CHO_APPROVED_BACKEND_SHA_FILE: ../ops/approved/backend_sha
          CHO_CHECKED_BACKEND_SHA: ${{ needs.validate.outputs.backend_sha }}
          CHO_RAW_PROJECT: ${{ vars.CHO_RAW_PROJECT }}
          CHO_RESEARCH_EVIDENCE_PROJECT: ${{ vars.CHO_RESEARCH_EVIDENCE_PROJECT }}
          CHO_RESEARCH_TRUSTED_EVIDENCE_BUCKET: ${{ vars.CHO_RESEARCH_TRUSTED_EVIDENCE_BUCKET }}
          W5_RESEARCH_STORAGE_BUCKET: ${{ vars.W5_RESEARCH_STORAGE_BUCKET }}
          CHO_EXPECTED_ISSUER_PRINCIPAL: ${{ vars.CHO_EXPECTED_ISSUER_PRINCIPAL }}
          CHO_RESEARCH_ISSUER_DSN: ${{ secrets.CHO_RESEARCH_ISSUER_DSN }}
          CHO_RESEARCH_EVIDENCE_READ_KEY: ${{ secrets.CHO_RESEARCH_EVIDENCE_READ_KEY }}
          CHO_RESEARCH_ISSUER_STORAGE_READ_KEY: ${{ secrets.CHO_RESEARCH_ISSUER_STORAGE_READ_KEY }}
        run: |
          python - <<'PY'
          import os
          from tools.w5_evidence_publisher import main
          raise SystemExit(main(['--mode', os.environ['MODE'], '--actions-sha', os.environ['OPS_SHA'],
              '--manifest-reference', os.environ['MANIFEST_REF'], '--expected-manifest-hash', os.environ['MANIFEST_HASH'],
              '--expected-code-sha', os.environ['RUNTIME_SHA'], '--confirm-manifest-hash', os.environ['CONFIRM_HASH']]))
          PY
